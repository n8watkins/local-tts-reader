<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Piper TTS</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">

      <!-- Header -->
      <header class="app-header">
        <img class="app-icon" src="icons/icon48.png" alt="" />
        <span class="app-title">Piper TTS</span>
        <span class="status-dot" id="status-dot" title="Checking…"></span>
        <span class="app-version" id="app-version"></span>
        <button class="btn-gear" id="settings-btn" title="Open settings">⚙</button>
      </header>

      <!-- Profile switcher -->
      <div class="profile-card">
        <button class="btn-nav" id="prev-profile-btn" title="Previous profile" disabled>‹</button>

        <div class="profile-info">
          <span class="profile-name" id="profile-name">—</span>
          <span class="profile-voice" id="profile-voice">Loading…</span>
        </div>

        <button class="btn-nav" id="next-profile-btn" title="Next profile" disabled>›</button>
        <button class="btn-add-profile" id="add-profile-btn" title="New profile">＋</button>
      </div>

      <!-- Inline new-profile form (replaces prompt()) -->
      <div class="new-profile-form hidden" id="new-profile-form">
        <span class="new-profile-header">New Profile</span>
        <input class="new-profile-input" type="text" id="new-profile-name"
               placeholder="e.g. Audiobooks" maxlength="40" />
        <div class="new-profile-actions">
          <button class="btn new-profile-save" id="new-profile-save">Save</button>
          <button class="btn new-profile-cancel" id="new-profile-cancel">Cancel</button>
        </div>
      </div>

      <!-- Compact sliders -->
      <div class="sliders">
        <div class="slider-row">
          <span class="slider-lbl">Speed</span>
          <input class="slider" type="range" id="rate-slider"
                 min="0.5" max="2.5" step="0.1" value="1.0" />
          <span class="slider-val" id="rate-value">1.0×</span>
        </div>
        <div class="slider-row">
          <span class="slider-lbl">Vol</span>
          <input class="slider" type="range" id="volume-slider"
                 min="0" max="2" step="0.05" value="1.0" />
          <span class="slider-val" id="volume-value">1.0</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button class="btn btn-test" id="test-btn">▶ Test</button>
        <button class="btn btn-stop" id="stop-btn">■ Stop</button>
      </div>

      <div class="progress-card hidden" id="progress-card">
        <div class="progress-row">
          <span class="progress-status" id="progress-status">Reading</span>
          <span class="progress-label" id="progress-label"></span>
        </div>
        <div class="progress-track" id="progress-track">
          <span class="progress-fill" id="progress-fill"></span>
        </div>
      </div>

      <p class="test-error hidden" id="test-error"></p>

      <!-- Footer -->
      <p class="footer-hint">
        Select text → right-click → <em>Read aloud</em>
      </p>

    </div>
    <script src="popup.js"></script>
  </body>
</html>
