<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Local TTS Reader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">

      <!-- Header -->
      <header class="app-header">
        <span class="app-icon">🔊</span>
        <h1 class="app-title">Local TTS Reader</h1>
        <span class="status-badge" id="piper-status-badge">Checking…</span>
        <span class="app-version" id="app-version"></span>
      </header>

      <!-- Profile -->
      <section class="section">
        <div class="row-between">
          <span class="label">Profile</span>
          <div class="icon-group">
            <button class="btn-icon" id="add-profile-btn"    title="New profile">＋</button>
            <button class="btn-icon" id="rename-profile-btn" title="Rename profile">✏</button>
            <button class="btn-icon btn-icon-danger" id="del-profile-btn" title="Delete profile">🗑</button>
          </div>
        </div>
        <select class="select" id="profile-select"></select>
      </section>

      <!-- Voice -->
      <section class="section">
        <span class="label">Voice</span>
        <div class="voice-row">
          <select class="select" id="voice-select">
            <option value="">Loading…</option>
          </select>
          <button class="btn-icon" id="fav-btn"       title="Favourite this voice">☆</button>
          <button class="btn-icon btn-icon-danger" id="del-voice-btn" title="Delete voice file">🗑</button>
        </div>
        <div class="voice-meta">
          <label class="checkbox-label small">
            <input type="checkbox" id="favs-only-check" />
            <span>Favourites only</span>
          </label>
          <a class="voices-link"
             href="https://huggingface.co/rhasspy/piper-voices/tree/main/en"
             target="_blank">Browse voices ↗</a>
        </div>
      </section>

      <!-- Speed -->
      <section class="section">
        <div class="slider-header">
          <label class="label" for="rate-slider">Speed</label>
          <span class="slider-value" id="rate-value">1.0</span>
        </div>
        <input class="slider" type="range" id="rate-slider"
               min="0.5" max="2.5" step="0.1" value="1.0" />
        <div class="slider-ticks">
          <span>0.5×</span><span>1.0×</span><span>2.5×</span>
        </div>
      </section>

      <!-- Volume -->
      <section class="section">
        <div class="slider-header">
          <label class="label" for="volume-slider">Volume</label>
          <span class="slider-value" id="volume-value">1.0</span>
        </div>
        <input class="slider" type="range" id="volume-slider"
               min="0" max="2" step="0.05" value="1.0" />
        <div class="slider-ticks">
          <span>0</span><span>1×</span><span>2×</span>
        </div>
      </section>

      <!-- Fallback -->
      <section class="section">
        <label class="checkbox-label">
          <input type="checkbox" id="fallback-checkbox" checked />
          <span>Use browser voice if Piper is offline</span>
        </label>
      </section>

      <!-- Actions -->
      <section class="section actions">
        <button class="btn btn-primary" id="test-btn">Test Voice</button>
        <button class="btn btn-danger"  id="stop-btn">Stop Reading</button>
      </section>

      <p class="test-error hidden" id="test-error"></p>

      <!-- Deleted voice log -->
      <details class="deleted-details" id="deleted-details">
        <summary class="deleted-summary">
          <span class="label">Deleted voices</span>
          <span class="deleted-count" id="deleted-count"></span>
        </summary>
        <div class="deleted-list" id="deleted-list"></div>
      </details>

      <p class="footer-hint">
        Highlight text → right-click → <strong>Read selected text</strong>
      </p>

    </div>
    <script src="popup.js"></script>
  </body>
</html>
